# Publishes the project page (https://j3ffx.github.io/botless/) to GitHub Pages when it changes on main: site/
# as is, plus privacy.html filled in from PRIVACY.md (scripts/build-site.mjs), so the published policy always
# matches the repository's. Nothing on the site loads from other sites.
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'PRIVACY.md', 'scripts/build-site.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false # let a running deploy finish

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy site/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the site
      id-token: write # deploy-pages proves the run's identity to Pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the site
        run: node scripts/build-site.mjs _site
        env:
          GITHUB_TOKEN: ${{ github.token }} # GitHub's Markdown API renders PRIVACY.md
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
