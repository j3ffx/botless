# Pushing a vN.N.N tag (made by `npm version patch|minor|major`, see CLAUDE.md → CI and releases) runs the full CI,
# then publishes a GitHub Release with the store-ready zip and notes built from the Conventional Commits.
# Run it by hand (Actions → Release → Run workflow) for a dry run: same build, zip and notes, nothing published.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: ${{ github.ref_type == 'tag' && 'Publish release' || 'Dry run' }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release notes need the previous tag and its history
          persist-credentials: false # gh gets its token from GH_TOKEN; nothing else needs git credentials
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Tag, package.json and manifest agree
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          manifest=$(node -p "require('./src/static/manifest.json').version")
          [ "$version" = "$manifest" ] || { echo "::error::package.json $version != manifest.json $manifest"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match version $version. Release with 'npm version'."; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: botless-dist
          path: dist/
      - run: npm run package -- "botless-$VERSION.zip"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: Release notes
        # Values reach the shell through env, never by pasting ${{ }} into the script (script injection).
        env:
          REF: ${{ github.ref_type == 'tag' && github.ref_name || 'HEAD' }}
        run: |
          node scripts/release-notes.mjs "$REF" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      # Releases are immutable once published (repo setting): neither the zip nor the tag can change afterwards.
      # So the zip goes onto a draft first, and the release is published only once the upload succeeded.
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" "botless-$VERSION.zip" --draft --verify-tag \
            --title "Botless $VERSION" --notes-file notes.md
          gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Keep the dry-run output
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: botless-${{ steps.version.outputs.version }}-dry-run
          path: |
            botless-*.zip
            notes.md
          retention-days: 7
