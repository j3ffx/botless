# Every push to main and every pull request: the same checks as `npm run verify`, the guarded CLAUDE.md
# invariants (tests/invariants.test.ts), a real-Chrome smoke test of the built extension, and the
# Conventional Commits rule. The built extension is kept as an artifact you can load unpacked.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # reused by release.yml, so a release is built and tested exactly like CI

concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; don't leave the token in .git/config for npm scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: botless-dist
          path: dist/
          retention-days: 14
          if-no-files-found: error

  smoke:
    name: Smoke test in Chrome
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Test the exact files that were built and checked above.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: botless-dist
          path: dist/
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs; allow them rather
      # than running Chrome with --no-sandbox.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Branded Chrome ignores --load-extension since v137; Chrome for Testing still honours it.
      # Pinned so required CI is deterministic; chrome-latest.yml tries the newest Chrome weekly and flags when
      # this pin should move (then update CHROME_VERSION here).
      - name: Install Chrome for Testing
        env:
          CHROME_VERSION: '156.0.8078.47'
        run: |
          path=$(npx @puppeteer/browsers install "chrome@$CHROME_VERSION" --path "$RUNNER_TEMP/browsers" | tail -n 1 | cut -d' ' -f2-)
          echo "CHROME_PATH=$path" >> "$GITHUB_ENV"
          "$path" --version
      - run: npm run smoke

  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check commit messages
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || github.event_name == 'push' && format('{0}..{1}', github.event.before, github.sha) || github.sha }}
        run: node scripts/check-commits.mjs "$RANGE"
