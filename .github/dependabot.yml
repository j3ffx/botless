# Weekly dependency PRs, grouped to keep the noise down. Titles follow Conventional Commits
# ("build(deps-dev): …", "ci(deps): …"), so they pass the commit check. Security fixes come as they're found.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      dev:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Must match the Node we run (.nvmrc). Bump it together with .nvmrc, by hand.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5
    # Wait a week before proposing a new release: compromised packages are usually caught and pulled within days.
    # Security updates are not delayed.
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
