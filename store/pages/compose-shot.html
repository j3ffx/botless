<!doctype html><meta charset="utf-8"><title>shot</title>
<style>
html,body{margin:0;width:1280px;height:800px;background:#0f0f0f;color:#f1f1f1;font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
.img{width:1280px;height:664px;background-repeat:no-repeat;background-position:0 0;background-size:1280px 800px}
.cap{height:136px;display:flex;align-items:center;gap:18px;padding:0 90px;box-sizing:border-box;border-top:1px solid #2a2a2e}
.cap b{font-size:34px;font-weight:600}.cap span{font-size:24px;color:#aaa}
.dot{width:16px;height:16px;border-radius:50%;background:#e52d2d;flex:none}
</style>
<div class="img" id="img"></div>
<div class="cap"><i class="dot"></i><div><b id="t"></b><br><span id="s"></span></div></div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('img').style.backgroundImage = `url(/store/captures/${q.get('img')})`;
document.getElementById('t').textContent = q.get('t');
document.getElementById('s').textContent = q.get('s');
</script>
