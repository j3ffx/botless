<!doctype html><meta charset="utf-8"><title>tile</title>
<style>
html,body{margin:0;width:440px;height:280px;background:#0f0f0f;color:#f1f1f1;font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
.w{display:flex;flex-direction:column;justify-content:center;height:100%;padding:0 34px;box-sizing:border-box}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
img{width:72px;height:72px;margin:-9px}
.name{font-size:40px;font-weight:600;letter-spacing:-0.5px}
.tag{font-size:23px;line-height:1.3;color:#d6d6d6}
.pill{display:inline-flex;align-items:center;gap:6px;background:#e52d2d;color:#fff;font-size:14px;font-weight:600;border-radius:999px;padding:3px 11px;margin-top:18px;width:max-content}
.pill i{width:7px;height:7px;border-radius:50%;background:#fff}
</style>
<div class="w">
  <div class="top"><img src="/src/static/icons/icon-128.png" alt=""><span class="name">Botless</span></div>
  <div class="tag">Know which YouTube channels<br>are probably AI.</div>
  <span class="pill"><i></i>Probably AI</span>
</div>
