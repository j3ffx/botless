<!doctype html><meta charset="utf-8"><title>thumb</title>
<style>
html,body{margin:0;width:1280px;height:720px;background:#0f0f0f;color:#f1f1f1;font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
.w{display:flex;align-items:center;height:100%;padding:0 70px;box-sizing:border-box;gap:50px}
.copy{width:520px;flex:none}
.top{display:flex;align-items:center;gap:20px;margin-bottom:28px}
img.i{width:128px;height:128px;margin:-16px}
.name{font-size:84px;font-weight:700;letter-spacing:-1px}
.tag{font-size:46px;line-height:1.15;font-weight:600}
.tag em{font-style:normal;color:#ff5a5a}
.shot{flex:none;width:600px;height:500px;border-radius:18px;overflow:hidden;box-shadow:0 0 0 2px #2e2e33;background:url(/store/captures/watch.png) -20px -48px/1050px 656px no-repeat;position:relative}
.pill{position:absolute;right:24px;top:24px;display:inline-flex;align-items:center;gap:10px;background:#e52d2d;color:#fff;font-size:34px;font-weight:700;border-radius:999px;padding:8px 22px}
.pill i{width:14px;height:14px;border-radius:50%;background:#fff}
</style>
<div class="w">
  <div class="copy"><div class="top"><img class="i" src="/src/static/icons/icon-128.png" alt=""><span class="name">Botless</span></div>
  <div class="tag">Spot <em>AI channels</em><br>on YouTube</div></div>
  <div class="shot"><span class="pill"><i></i>Probably AI</span></div>
</div>
